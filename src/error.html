<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>LaunchKit · %sveltekit.status%</title>
		<!-- Last-resort page (the app itself could not render, e.g. the API is unreachable): no script, no font.
		     The message comes from handleError, already in the right language; the rest is in both languages. -->
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 24px;
				box-sizing: border-box;
				background: #f8fafc;
				color: #0f172a;
				font: 16px/1.5 system-ui, sans-serif;
			}
			main {
				max-width: 480px;
				padding: 40px 32px;
				border: 1px solid #e2e8f0;
				border-radius: 16px;
				background: #fff;
				text-align: center;
			}
			.brand {
				margin: 0 0 24px;
				color: #0f172a;
				font-weight: 700;
				font-size: 20px;
			}
			.brand span {
				color: #4f46e5;
			}
			h1 {
				margin: 0 0 12px;
				font-size: 24px;
			}
			p {
				color: #475569;
			}
			a {
				display: inline-block;
				margin-top: 16px;
				padding: 12px 20px;
				border-radius: 10px;
				background: #4f46e5;
				color: #fff;
				font-weight: 600;
				text-decoration: none;
			}
		</style>
	</head>
	<body>
		<main>
			<p class="brand">Launch<span>Kit</span></p>
			<h1>Un problème est survenu <span lang="en">· Something went wrong</span></h1>
			<p>%sveltekit.error.message%</p>
			<a href="/">Accueil · <span lang="en">Home</span></a>
		</main>
	</body>
</html>
